    <style>
    html, body {
    height: 100%;
    margin: 0;
    }

    body {
    display: flex;
    flex-direction: column;
    }
    .contenido-principal {
    flex: 1;
    }


    .navbar-portal {
    position: relative;
    background-color: #000;
    padding: 18px 24px;
    border-bottom: 1px solid #1a1a1a;
    }

    /* Botón derecha */
    .btn-gestion {
    position: absolute;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    }



    /* Links */
    .navbar-portal .nav {
    margin: 0;
    }

    .navbar-portal .nav-link {
    color: #fff;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    padding: 10px 22px;
    position: relative;
    transition: color 0.2s ease;
    }

    .navbar-portal .nav-link:hover {
    color: #cfcfcf;
    }

    /* Activo */
    .navbar-portal .nav-link.active {
    font-weight: 600;
    }

    /* Línea inferior */
    .navbar-portal .nav-link::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 2px;
    width: 0;
    height: 2px;
    background-color: #fff;
    transform: translateX(-50%);
    transition: width 0.25s ease;
    }

    .navbar-portal .nav-link:hover::after {
    width: 55%;
    }


/*--------------------FOOTER----------------*/


.footer-portal {
  background-color: #000;     
  color: #fff;               
  padding: 2rem 0 1.5rem;
  font-size: 14px;
}

.footer-portal h6 {
  font-size: 12px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: #8a8a8a;
}

.footer-portal .container > * {
  margin-bottom: 0.5rem;
}

/* Contacto */
.footer-portal .d-flex {
  margin-top: 0.75rem;
}

.footer-portal a {
  color: #b5b5b5;
  font-size: 20px;
  margin: 0 14px;               /* separación segura */
  transition: color 0.2s ease, transform 0.2s ease;
}

.footer-portal a:hover {
  color: #ffffff;
  transform: translateY(-2px);
}

/* Derechos */
.footer-portal p {
  margin-top: 1.5rem;
  margin-bottom: 0.25rem;
}

.footer-portal small {
  font-size: 12px;
  color: #7d7d7d;
}
.footer-contactos {
  margin-top: 1rem;
}
.footer-contactos {
  display: flex;
  justify-content: center;
}

.contacto-item {
  display: flex;
  align-items: center;
  gap: 8px;        /* espacio icono - texto */
  margin: 0 15px; /* ← separación ENTRE items */
  color: #b5b5b5;
  font-size: 14px;
}

.contacto-item i {
  font-size: 18px;
}






/* Botón izquierda */
.btn-inicio {
  position: absolute;
  left: 24px;
  top: 50%;
  transform: translateY(-50%);
  border-radius: 0;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 8px 14px;
  color: #fff;
}

/* =========================
   RESPONSIVE NAVBAR
   ========================= */
@media (max-width: 768px) {

  .navbar-portal {
    padding: 16px;
    text-align: center;
  }

  /* Sacamos posiciones absolutas */
  .btn-inicio,
  .btn-gestion {
    position: static;
    transform: none;
    display: inline-block;
    margin: 8px 0;
    width: 100%;
    max-width: 240px;
  }

  /* Centramos todo */
  .navbar-portal {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  /* Menú en columna */
  .navbar-portal .nav {
    flex-direction: column;
  }

  .navbar-portal .nav-link {
    padding: 8px 0;
  }

  /* Línea inferior más corta */
  .navbar-portal .nav-link::after {
    bottom: 0;
  }
}
/* TOP BAR */
.nav-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* HAMBURGUESA */
.menu-toggle {
  display: none;
  background: none;
  color: #fff;
  padding: 6px 10px;
  font-size: 1.1rem;
}

/* MENU */
.nav-menu {
  justify-content: center;
}

/* =====================
   MOBILE
   ===================== */
@media (max-width: 768px) {

  .menu-toggle {
    display: block;
  }

  .nav-menu {
    display: none;
    flex-direction: column;
    margin-top: 12px;
  }

  /* Mostrar menú cuando está activo */
  .navbar-portal.active .nav-menu {
    display: flex;
  }

  .nav-link {
    padding: 10px 0;
  }

  .btn-inicio,
  .btn-gestion {
    position: static;
    transform: none;
  }
}
@media (max-width: 768px) {

    justify-content: space-between;

  .btn-inicio {
    margin-right: auto;
  }

  .menu-toggle {

body {
  min-height: 100vh;
  background: #fff;
  color: #171717;
}

.contenido-principal {
  width: 100%;
}

.navbar-portal {
  position: sticky;
  top: 0;
  z-index: 1000;
  display: block;
  padding: 0 1.5rem;
  border-bottom: 3px solid #c89b3c;
  background: #101010;
  box-shadow: 0 4px 18px rgba(0, 0, 0, .18);
  text-align: left;
}

.navbar-portal .nav-top {
  max-width: 1280px;
  min-height: 78px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.navbar-portal .btn-inicio,
.navbar-portal .btn-gestion {
  position: static;
  width: auto;
  max-width: none;
  margin: 0;
  padding: 0;
  transform: none;
  color: #fff;
}

.navbar-portal .btn-gestion {
  display: inline-flex;
  width: 44px;
  height: 44px;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 50%;
}

.navbar-portal .btn-gestion:hover {
  border-color: #d3a742;
  background: rgba(200, 155, 60, .15);
  color: #fff;
}

.nav-logo {
  width: auto;
  height: 46px;
  object-fit: contain;
}

.navbar-portal .nav-menu {
  display: flex;
  max-width: 1280px;
  justify-content: center;
  gap: .35rem;
  margin: 0 auto;
  padding: 0 0 .65rem;
  list-style: none;
}

.navbar-portal .nav-link {
  padding: .7rem 1rem;
  border-radius: .65rem;
  color: rgba(255,255,255,.76);
  font-size: .78rem;
  font-weight: 750;
  letter-spacing: .08em;
  transition: background .2s ease, color .2s ease;
}

.navbar-portal .nav-icon {
  display: none;
}

.navbar-portal .nav-link::after {
  display: none;
}

.navbar-portal .nav-link:hover,
.navbar-portal .nav-link.active {
  background: rgba(255,255,255,.09);
  color: #fff;
}

.navbar-portal .nav-link.active {
  box-shadow: inset 0 -2px #c89b3c;
}

.menu-toggle {
  display: none;
  border: 1px solid rgba(255,255,255,.2);
  color: #fff;
}

.footer-portal {
  margin-top: 3rem;
  padding: 2.5rem 1rem 1.5rem;
  background: #101010;
  color: #d7dce2;
}

.footer-portal h6 {
  color: #d3ad5a;
  font-weight: 750;
}

.footer-gestion {
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  margin: 0 0 0 .25rem !important;
  border: 1px solid rgba(200, 155, 60, .55);
  border-radius: 999px;
  padding: .15rem .55rem;
  color: #d3ad5a !important;
  font-size: .75rem !important;
  text-decoration: none;
  vertical-align: middle;
}

.footer-gestion:hover {
  background: #c89b3c;
  color: #111 !important;
}

.footer-contactos {
  flex-wrap: wrap;
  gap: .5rem 1.25rem !important;
}

.contacto-item {
  margin: 0;
  font-size: .9rem;
}

:root {
  --portal-black: #101010;
  --portal-white: #fff;
  --portal-gold: #c89b3c;
  --portal-gold-dark: #9b7428;
  --portal-ink: #171717;
  --portal-muted: #696969;
  --portal-border: #e7e2d7;
}

.web-filtros {
  margin-bottom: 1.5rem;
  border: 1px solid var(--portal-border);
  border-radius: .85rem;
  padding: 1.15rem 1.25rem .25rem;
  background: #fff;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .045);
}

.web-filtros-cabecera {
  margin-bottom: 1rem;
}

.web-filtros-kicker {
  color: var(--portal-gold-dark);
  font-size: .7rem;
  font-weight: 850;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.web-filtros-cabecera h2 {
  margin: .25rem 0;
  color: var(--portal-ink);
  font-size: 1.05rem;
  font-weight: 850;
}

.web-filtros-cabecera p {
  margin: 0;
  color: var(--portal-muted);
  font-size: .85rem;
}

.web-filtro-label {
  display: block;
  margin-bottom: .35rem;
  color: var(--portal-ink);
  font-size: .8rem;
  font-weight: 750;
}

.web-filtros .bootstrap-select > .dropdown-toggle {
  min-height: 42px;
  border: 1px solid #d8d8d8;
  border-radius: .4rem;
  background: #fff;
  color: var(--portal-ink);
}

.web-filtros .bootstrap-select > .dropdown-toggle:focus {
  outline: 2px solid rgba(200, 155, 60, .35) !important;
  outline-offset: 1px;
}

.web-filtros .dropdown-item.active,
.web-filtros .dropdown-item:active {
  background: var(--portal-black);
  color: #fff;
}

.btn-web-buscar {
  min-height: 42px;
  border: 1px solid var(--portal-gold);
  border-radius: .4rem;
  background: var(--portal-gold);
  color: #111;
  font-weight: 850;
}

.btn-web-buscar:hover,
.btn-web-buscar:focus {
  border-color: var(--portal-gold-dark);
  background: var(--portal-gold-dark);
  color: #fff;
}

.btn-web-buscar:disabled {
  border-color: #dedede;
  background: #ededed;
  color: #777;
}

@media (max-width: 768px) {
  body {
    padding-bottom: calc(70px + env(safe-area-inset-bottom));
  }

  .navbar-portal {
    display: block;
    padding: 0 .85rem;
  }

  .navbar-portal .nav-top {
    min-height: 64px;
    justify-content: center;
  }

  .nav-logo {
    height: 37px;
  }

  .navbar-portal .btn-inicio {
    justify-content: center;
    margin: 0 auto;
  }

  .navbar-portal .nav-menu {
    display: flex;
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 1200;
    width: 100%;
    max-width: none;
    flex-direction: row;
    align-items: stretch;
    justify-content: space-around;
    gap: 0;
    margin: 0;
    border-top: 2px solid var(--portal-gold);
    padding: .3rem .15rem calc(.3rem + env(safe-area-inset-bottom));
    background: var(--portal-black);
    box-shadow: 0 -5px 20px rgba(0, 0, 0, .18);
  }

  .navbar-portal .nav-item {
    flex: 1;
    min-width: 0;
  }

  .navbar-portal .nav-link {
    display: flex;
    min-height: 54px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .2rem;
    padding: .35rem .1rem;
    font-size: .58rem;
    letter-spacing: 0;
    text-align: center;
  }

  .navbar-portal .nav-icon {
    display: block;
    font-size: 1.05rem;
    line-height: 1;
  }

  .navbar-portal .nav-link.active {
    background: rgba(200, 155, 60, .12);
    box-shadow: none;
    color: #d3ad5a;
  }

  .footer-portal {
    margin-top: 2rem;
    padding-top: 2rem;
  }
}

@media (max-width: 380px) {
  .navbar-portal .nav-top {
    min-height: 58px;
  }

  .nav-logo {
    height: 31px;
  }

}

  </style>
    {% block styles %}
    {% endblock %}

<script>
  const portalMenu = document.querySelector('#portal-menu');
  const portalPath = window.location.pathname.replace(/\/+$/, '') || '/';

  portalMenu.querySelectorAll('a[href]').forEach(link => {
    const linkPath = new URL(link.href, window.location.origin).pathname.replace(/\/+$/, '') || '/';
    const isCurrent = portalPath === linkPath ||
      (linkPath === '/web/partidos' && portalPath === '/web/detallePartidos');
    link.classList.toggle('active', isCurrent);
    if (isCurrent) link.setAttribute('aria-current', 'page');
  });
</script>
