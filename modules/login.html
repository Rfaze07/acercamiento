<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Ingreso | Básquet La Emilia</title>
        <link rel="apple-touch-icon" sizes="180x180" href="img/favicon/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16x16.png">
        <link rel="manifest" href="img/favicon/site.webmanifest">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/bootstrap.min.css">
		<link rel="stylesheet" href="css/sweetalert2.min.css">
        <link rel="stylesheet" href="css/login.css">
        <link rel="stylesheet" href="css/login-theme.css">
    </head>
    <body id="bgLogin">
        <main class="login-layout">
            <section class="login-brand-panel">
                <div class="login-brand-content">
                    <img src="/img/logo.png" class="login-brand-logo" alt="Club La Emilia">
                    <p class="login-overline">Club La Emilia · Básquet</p>
                    <h1 class="login-brand-title">Basquet<br>La Emilia</h1>
                    <p class="login-brand-copy">Administración de clubes, equipos, jugadores y competencias.</p>
                    <div class="login-brand-foot">Gestión deportiva</div>
                </div>
            </section>
            <section class="login-form-panel">
                <div class="login-auth-card">
                    <p class="login-auth-kicker">Panel de administración</p>
                    <h2 class="login-auth-title">Bienvenido</h2>
                    <p class="login-auth-copy">Ingresá con tus credenciales para continuar.</p>
                    <form id="frmLogin" class="login-form" action="/login" method="post">
                        <div class="form-group">
                            <label for="txtUser" class="form-label">Usuario</label>
                            <input type="text" id="txtUser" name="user" class="form-control login-input"
                                placeholder="Tu usuario" autocomplete="username" required>
                        </div>
                        <div class="form-group">
                            <label for="txtPass" class="form-label">Contraseña</label>
                            <input type="password" id="txtPass" name="pass" class="form-control login-input"
                                placeholder="Tu contraseña" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn login-submit" id="btnIngresar">Ingresar</button>
                    </form>
                    <p class="login-auth-foot">Acceso para personal autorizado.</p>
                </div>
            </section>
        </main>
        <script type="text/javascript" src="js/jquery.min.js"></script>
        <script type="text/javascript" src="js/popper.min.js"></script>
        <script type="text/javascript" src="js/bootstrap.min.js"></script>
        <script type="text/javascript" src="js/sweetalert2.all.js"></script>
        <script type="text/javascript">
            const Login = async () => {
                const $button = $('#btnIngresar')
                if ($button.prop('disabled')) return
                const resetButton = () => $button.prop('disabled', false).text('Ingresar')
                $button.prop('disabled', true).html(
                    '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Ingresando...'
                )
                try {
                    const res = await $.post('/login', {
                        user: $('#txtUser').val(),
                        pass: $('#txtPass').val()
                    })
                    if (res.status) {
                        window.location.href = '/inicio'
                        return
                    }
                    resetButton()
                    await Swal.fire(res.title || 'Error', res.text || 'No se pudo iniciar sesión.', res.icon || 'error')
                } catch (error) {
                    console.error(error)
                    resetButton()
                    await Swal.fire('Error', 'No se pudo conectar con el servicio de autenticación.', 'error')
                } finally {
                    resetButton()
                }
            }

            $('#frmLogin').on('submit', event => {
                event.preventDefault()
                Login()
            })
        </script>
    </body>
</html>
