{% extends '../../template.html' %}

{% block styles %}
<style>
    .textAreaSize {
        resize: vertical;
        min-height: 48px;
        max-height: 100px;
    }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center">
    <h2>{{ pagename }}</h2>
    <div class="d-flex flex-wrap align-items-end mb-3" style="gap: 0.4rem;">
        <input type="text" class="form-control form-control-sm" id="txtFiltro" placeholder="Buscar" style="width: 10rem;" />
        <div>
            <label>Torneo</label>
            <select class="form-control form-control-sm selectpicker" id="cmbTorneoFiltro" data-live-search="true" onchange="CambiarTorneoFiltro()">
                <option value="t">Todos</option>
            </select>
        </div>
        <div>
            <label>Categoría</label>
            <select class="form-control form-control-sm selectpicker" id="cmbCategoriaFiltro" data-live-search="true" onchange="CambiarCategoriaFiltro()">
                <option value="t">Todas</option>
            </select>
        </div>
        <div>
            <label>Fase</label>
            <select class="form-control form-control-sm selectpicker" id="cmbFaseFiltro" data-live-search="true" onchange="getLista()">
                <option value="t">Todas</option>
            </select>
        </div>
        <div>
            <label>Equipos</label>
            <select class="form-control form-control-sm selectpicker" id="cmbEquipoFiltro" onchange="getLista()"></select>
        </div>
        <div>
            <label>Estado</label>
            <select class="form-control form-control-sm selectpicker" id="cmbEstadoFiltro" onchange="getLista()">
                <option value="t" selected>Todos</option>
                <option value="0">No comenzado</option>
                <option value="1">En curso</option>
                <option value="2">Finalizado</option>
            </select>
        </div>
        <div>
            <label>Desde</label>
            <input type="date" class="form-control form-control-sm" id="fechaDesdeFiltro" onchange="getLista()" />
        </div>
        <div>
            <label>Hasta</label>
            <input type="date" class="form-control form-control-sm" id="fechaHastaFiltro" onchange="getLista()" />
        </div>
        {% if permisos.a == 1 %}
        <button class="btn btn-sm btn-round btn-success modalAccion mr-1" data-accion="a" onclick='ModalAccion("a")'>
            <i class="fa fa-plus"></i>
        </button>
        {% endif %}
    </div>
</div>
<div class="table-responsive" style="height: calc(100vh - 200px)" id="tablaDatos">
    <table class="table table-sm table-fix table-hover tableFixHead">
        <thead>
            <tr data-search="${escaparHtmlPartido(textoBusqueda)}">
                <th scope="col">Acciones</th>
                <th scope="col">Fecha y Hora</th>
                <th scope="col">Equipos</th>
                <th scope="col">Competencia</th>
                <th scope="col">Estado</th>
                <th scope="col">Resultado</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<!-- MODAL -->
<div class="modal fade modal-m" data-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="staticBackdropLabel" aria-hidden="true" id="modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalLabel"></h5>
                <button type="button" class="close" aria-label="Close" onclick="CerrarModal()">
                    <span aria-hidden=" true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="form-group col-sm-12 col-md-8">
                        <label for="fecha">Fecha</label>
                        <input type="text" class="form-control form-control-sm datepicker" id="fecha" placeholder="dd/mm/yyyy" maxlength="10" >
                    </div>
                    <div class="form-grouo col-sm-12 col-md-4">
                        <label for="hora">Hora</label>
                        <input type="text" class="form-control form-control-sm timepicker" id="hora" placeholder="hh:mm" maxlength="5" >
                    </div>
                </div>
                <div class="row">
                    <div class="form-group col-sm-12">
                        <label for="cmbTorneo">Torneo</label>
                        <select class="form-control form-control-sm selectpicker" id="cmbTorneo" data-live-search="true">
                            <option value="">Sin torneo</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="form-group col-sm-12 col-md-6">
                        <label for="cmbCategoria">Categoría</label>
                        <select class="form-control form-control-sm selectpicker" id="cmbCategoria" data-live-search="true">
                            <option value="">Sin categoría</option>
                        </select>
                    </div>
                    <div class="form-group col-sm-12 col-md-6">
                        <label for="cmbFase">Fase</label>
                        <select class="form-control form-control-sm selectpicker" id="cmbFase" data-live-search="true">
                            <option value="">Sin fase</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="form-group col-sm-12 col-md-6">
                        <label for="cmbEquipoA">Equipo A</label>
                        <select class="form-control form-control-sm selectpicker" id="cmbEquipoA">
                        </select>
                    </div>
                    <div class="form-group col-sm-12 col-md-6">
                        <label for="cmbEquipoB">Equipo B</label>
                        <select class="form-control form-control-sm selectpicker" id="cmbEquipoB">
                        </select>
                    </div>
                </div>
                <!-- <div class="row d-none" id="actionSeccion">
                    <div class="form-group col-sm-12 text-center">
                        <div class="custom-control custom-switch ml-1">
                            <input type="checkbox" class="custom-control-input" id="chbActivo" />
                            <label class="custom-control-label" for="chbActivo">Activo</label>
                        </div>
                    </div>
                </div> -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="CerrarModal()">Cancelar</button>
                <button type="button" class="btn btn-success" id="btnAccion">Guardar</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    let opcionesClasificacionPartidos = { torneos: [], categorias: [], fases: [] }

    $(document).ready(async () => {
        await ObtenerCmbEquipos('cmbEquipoFiltro', true)
        try {
            await CargarOpcionesClasificacion()
        } catch (error) {
            console.error('Error cargando filtros de clasificación:', error)
            await Swal.fire({ icon: 'error', title: 'Error', text: 'No se pudieron cargar los filtros de torneos.' })
        }
        //getLista()
        
        // Máscara para fecha dd/mm/yyyy
        $('#fecha').on('input', function() {
            let value = this.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2);
            }
            if (value.length >= 5) {
                value = value.substring(0, 5) + '/' + value.substring(5, 9);
            }
            this.value = value;
        });
        
        // Máscara para hora hh:mm
        $('#hora').on('input', function() {
            let value = this.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + ':' + value.substring(2, 4);
            }
            this.value = value;
        });

        getLista()
    })

    $("#txtFiltro").keyup(async function () {
        Filtrar()
    })

    const escaparHtmlPartido = (valor) => String(valor == null ? '' : valor).replace(/[&<>"']/g, caracter => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    }[caracter]));
    
    const getLista = async () => {
        $("#preloaderAPP").show()
        let res
        try {
            res = await $.post('/partidos/getListaAjax', {
                equipo: $('#cmbEquipoFiltro').val(),
                estado: $('#cmbEstadoFiltro').val(),
                torneo: $('#cmbTorneoFiltro').val(),
                categoria: $('#cmbCategoriaFiltro').val(),
                fase: $('#cmbFaseFiltro').val(),
                fecha_desde: $('#fechaDesdeFiltro').val(),
                fecha_hasta: $('#fechaHastaFiltro').val()
            })
        } catch (error) {
            $("#preloaderAPP").hide()
            console.error('Error filtrando partidos:', error)
            const respuesta = error.responseJSON || {}
            await Swal.fire({ icon: 'error', title: respuesta.title || 'Error', text: respuesta.text || 'No se pudieron cargar los partidos.' })
            return
        }
        let html = ""
        if(res.status){
            for (let i = 0; i < res.data.length; i++) {
                const partido = res.data[i];
                const torneo = [partido.torneo, partido.temporada].filter(Boolean).join(' ')
                const competencia = [torneo, partido.categoria, partido.fase].filter(Boolean).join(' · ')
                const textoBusqueda = [
                    changeDateDMY(partido.fecha_hora.split(' ')[0]),
                    partido.equipoA,
                    partido.equipoB,
                    torneo,
                    partido.categoria,
                    partido.fase
                ].filter(Boolean).join(' ')
                let accionesHtml = `<button class="btn btn-round btn-sm btn-info" data-toggle="tooltip" data-placement="top" title="Planilla Digital" onclick="AbrirPlanillaDigital(${partido.id})"><i class="fa fa-clipboard-list"></i></button>`;
                if (partido.estado === 0) {
                    accionesHtml += `
                    {% if permisos.m == 1 %}
                    <button class="btn btn-round btn-sm btn-warning" data-accion="m" data-toggle="tooltip" data-placement="top" title="Modificar" onclick="ModalAccion('m',${partido.id})"><i class="fa fa-pen"></i></button>
                    {% endif %}
                    {% if permisos.b == 1 %}
                    <button class="btn btn-round btn-sm btn-danger" onclick="Eliminar(${partido.id})" data-toggle="tooltip" data-placement="top" title="Eliminar"><i class="fa fa-trash-alt"></i></button>
                    {% endif %}
                    `
                }
                html += `
                    <tr>
                        <td>
                            <div style="display: flex; gap: 2px;">
                                ${accionesHtml}
                            </div>
                        </td>
                        <td class='search'>${changeDateDMY(partido.fecha_hora.split(' ')[0])} ${partido.fecha_hora.split(' ')[1]}</td>
                        <td>${escaparHtmlPartido(partido.equipoA)} vs ${escaparHtmlPartido(partido.equipoB)}</td>
                        <td>${escaparHtmlPartido(competencia) || '—'}</td>
                        <td>${partido.estado === 0 ? 'Sin Comenzar' : partido.estado === 1 ? 'En Curso' : 'Finalizado'}</td>
                        <td>${partido.puntosA} - ${partido.puntosB}</td>
                    </tr>`
            }
        }else{
            html = `<tr><td class="font-weight-bold" colspan="6">${escaparHtmlPartido(res.text)}</td></tr>`
        }
        $('#tablaDatos tbody').html(html)
        $("#preloaderAPP").hide()
        $('[data-toggle="tooltip"]').tooltip()
    }

    const ModalAccion = async (accion, id) => {
        try {
            PrepararClasificacionModal()
            await CargarEquiposPartido()
        } catch (error) {
            console.error('Error preparando el formulario del partido:', error)
            await Swal.fire({ icon: 'error', title: 'Error', text: 'No se pudieron cargar las categorías y equipos.' })
            return
        }
        
        // Aplicar máscaras cuando se abre el modal
        setTimeout(() => {
            // Máscara para fecha dd/mm/yyyy
            $('#fecha').off('input.mask').on('input.mask', function() {
                let value = this.value.replace(/\D/g, '');
                if (value.length >= 2) {
                    value = value.substring(0, 2) + '/' + value.substring(2);
                }
                if (value.length >= 5) {
                    value = value.substring(0, 5) + '/' + value.substring(5, 9);
                }
                this.value = value;
            });
            
            // Máscara para hora hh:mm
            $('#hora').off('input.mask').on('input.mask', function() {
                let value = this.value.replace(/\D/g, '');
                if (value.length >= 2) {
                    value = value.substring(0, 2) + ':' + value.substring(2, 4);
                }
                this.value = value;
            });
        }, 100);
        
        $("#preloaderAPP").show()
        if (accion === 'a') {
            $('#modalLabel').text('Nuevo partido')
            $('#btnAccion').attr('onclick', `PostRegistro("a")`)
            $('#btnAccion').text('Guardar')
        }
        if (accion == 'm') {
            try {
                let res = await $.post(`/partidos/getByIdAjax`, {id})
                if (!res.status) throw new Error(res.text || 'No se pudo cargar el partido')
                $('#fecha').val(changeDateDMY(res.data.fecha_hora.split(' ')[0]))
                $('#hora').val(res.data.fecha_hora.split(' ')[1])
                PrepararClasificacionModal(res.data.id_torneo_fk, res.data.id_torneo_categoria_fk, res.data.id_fase_fk)
                await CargarEquiposPartido(res.data.id_torneo_categoria_fk, res.data.id_equipoA_fk, res.data.id_equipoB_fk)
                $('#cmbEquipoA').selectpicker('val', res.data.id_equipoA_fk)
                $('#cmbEquipoB').selectpicker('val', res.data.id_equipoB_fk)
            } catch (error) {
                $("#preloaderAPP").hide()
                console.error('Error cargando el partido:', error)
                await Swal.fire({ icon: 'error', title: 'Error', text: 'No se pudieron cargar los datos del partido.' })
                return
            }
            $('#modalLabel').text('Modificar partido')
            $('#btnAccion').text('Guardar')
            $('#btnAccion').attr('onclick', `PostRegistro("m",${id})`)
            //$('#actionSeccion').removeClass('d-none')
            //$('#actionSeccionDivider').removeClass('d-none')
        }
        $("#preloaderAPP").hide()
        $('#modal').modal('show')
    }

    const PostRegistro = async (accion, Id) => {
        $("#preloaderAPP").show()
        let url = '/partidos/alta',
            body = {
                fecha_hora: $('#fecha').val() + ' ' + $('#hora').val(),
                id_equipoA_fk: $('#cmbEquipoA').val(),
                id_equipoB_fk: $('#cmbEquipoB').val(),
                id_torneo_fk: $('#cmbTorneo').val(),
                id_torneo_categoria_fk: $('#cmbCategoria').val(),
                id_fase_fk: $('#cmbFase').val()
            }

        if (accion === 'm') {
            url = '/partidos/modificar'
            //body.activo = $('#chbActivo').prop('checked') ? 1 : 0
            body.id = Id
        }

        try {
            const res = await $.post(url, body)
            $("#preloaderAPP").hide()
            Swal.fire({
                icon: res.icon,
                title: res.title,
                text: res.text,
                timer: 2000
            }).then(() => {
                if(res.status){
                    CerrarModal()
                    getLista()
                }
            })
        } catch (error) {
            $("#preloaderAPP").hide()
            console.error('Error guardando el partido:', error)
            const respuesta = error.responseJSON || {}
            await Swal.fire({ icon: respuesta.icon || 'error', title: respuesta.title || 'Error', text: respuesta.text || 'No se pudo guardar el partido.' })
        }
    }

    const Eliminar = (id) => {
        Swal.fire({
            title: 'Confirmar',
            text: "¿Desea borrar este registro?",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            confirmButtonText: 'Sí, eliminar.',
            cancelButtonColor: '#d33',
            cancelButtonText: 'No, cancelar.'
        }).then(async result => {
            if (result.isConfirmed) {
                $("#preloaderAPP").show();
                let res = await $.post('/partidos/eliminar', { id })
                $("#preloaderAPP").hide();
                Swal.fire({
                    type: res.type,
                    icon: res.icon,
                    title: res.title,
                    text: res.text,
                    timer: 2000
                }).then(() => {
                    if(res.status){
                        CerrarModal()
                        getLista()
                    }
                })
            }    
        })
    }

    const Filtrar = () => {
        $('#tablaDatos tbody tr').each(function () {
            if (($(this).data('search') || $(this).text()).toUpperCase().indexOf($('#txtFiltro').val().toUpperCase()) > -1)
                $(this).closest('tr').show();
            else
                $(this).closest('tr').hide();
        })
    }

    const CargarOpcionesClasificacion = async () => {
        const res = await $.post('/partidos/getOpcionesClasificacionAjax')
        if (!res.status) throw new Error(res.text || 'No se pudieron cargar las opciones')
        opcionesClasificacionPartidos = res.data
        actualizarFiltrosClasificacion()
    }

    const llenarSelectClasificacion = (selector, elementos, placeholder, valorVacio, texto) => {
        let html = `<option value="${valorVacio}">${placeholder}</option>`
        elementos.forEach(elemento => {
            html += `<option value="${elemento.id}">${escaparHtmlPartido(texto(elemento))}</option>`
        })
        $(selector).html(html).selectpicker('refresh')
    }

    const categoriasPorTorneo = torneoId => opcionesClasificacionPartidos.categorias
        .filter(categoria => !torneoId || torneoId === 't' || Number(categoria.id_torneo_fk) === Number(torneoId))

    const fasesPorClasificacion = (torneoId, categoriaId) => {
        if (categoriaId == null || categoriaId === '') return []
        const categorias = categoriasPorTorneo(torneoId)
        const idsCategorias = new Set(categorias.map(categoria => Number(categoria.id)))
        return opcionesClasificacionPartidos.fases.filter(fase =>
            idsCategorias.has(Number(fase.id_torneo_categoria_fk)) &&
            (!categoriaId || categoriaId === 't' || Number(fase.id_torneo_categoria_fk) === Number(categoriaId)))
    }

    const etiquetaTorneo = torneo => [torneo.nombre, torneo.temporada].filter(Boolean).join(' · ')
    const etiquetaCategoria = categoria => {
        const torneo = opcionesClasificacionPartidos.torneos.find(item => Number(item.id) === Number(categoria.id_torneo_fk))
        return torneo ? `${categoria.nombre} · ${etiquetaTorneo(torneo)}` : categoria.nombre
    }
    const etiquetaFase = fase => {
        const categoria = opcionesClasificacionPartidos.categorias.find(item => Number(item.id) === Number(fase.id_torneo_categoria_fk))
        return [fase.nombre, fase.tipo, categoria ? etiquetaCategoria(categoria) : ''].filter(Boolean).join(' · ')
    }

    const actualizarFiltrosClasificacion = () => {
        llenarSelectClasificacion('#cmbTorneoFiltro', opcionesClasificacionPartidos.torneos, 'Todos', 't', etiquetaTorneo)
        actualizarCategoriasFiltro()
    }

    const actualizarCategoriasFiltro = () => {
        const torneoId = $('#cmbTorneoFiltro').val() || 't'
        llenarSelectClasificacion('#cmbCategoriaFiltro', categoriasPorTorneo(torneoId), 'Todas', 't', etiquetaCategoria)
        $('#cmbCategoriaFiltro').val('t').selectpicker('refresh')
        actualizarFasesFiltro()
    }

    const actualizarFasesFiltro = () => {
        const torneoId = $('#cmbTorneoFiltro').val() || 't'
        const categoriaId = $('#cmbCategoriaFiltro').val() || 't'
        llenarSelectClasificacion('#cmbFaseFiltro', fasesPorClasificacion(torneoId, categoriaId), 'Todas', 't', etiquetaFase)
        $('#cmbFaseFiltro').val('t').selectpicker('refresh')
    }

    const CambiarTorneoFiltro = () => {
        actualizarCategoriasFiltro()
        getLista()
    }

    const CambiarCategoriaFiltro = () => {
        actualizarFasesFiltro()
        getLista()
    }

    const PrepararClasificacionModal = (torneoId = '', categoriaId = '', faseId = '') => {
        llenarSelectClasificacion('#cmbTorneo', opcionesClasificacionPartidos.torneos, 'Sin torneo', '', etiquetaTorneo)
        $('#cmbTorneo').val(torneoId || '').selectpicker('refresh')
        llenarSelectClasificacion('#cmbCategoria', categoriasPorTorneo(torneoId), 'Sin categoría', '', etiquetaCategoria)
        $('#cmbCategoria').val(categoriaId || '').selectpicker('refresh')
        llenarSelectClasificacion('#cmbFase', fasesPorClasificacion(torneoId, categoriaId), 'Sin fase', '', etiquetaFase)
        $('#cmbFase').val(faseId || '').selectpicker('refresh')
    }

    const CargarEquiposPartido = async (categoriaId = '', equipoA = '', equipoB = '') => {
        let res
        if (categoriaId) {
            res = await $.post('/partidos/getEquiposPorCategoriaAjax', { id_categoria: categoriaId })
        } else if ($('#cmbTorneo').val()) {
            res = { status: true, data: [] }
        } else {
            res = await $.post('/equipos/getListaSelectAjax')
        }
        if (!res.status) throw new Error(res.text || 'No se pudieron cargar los equipos')
        const options = Array.isArray(res.data) ? res.data : []
        const opcionesHtml = options.map(equipo => `<option value="${equipo.id}">${escaparHtmlPartido(equipo.nombre_inscripcion || equipo.nombre)}</option>`).join('')
        $('#cmbEquipoA, #cmbEquipoB').html(opcionesHtml).selectpicker('refresh')
        if (equipoA) $('#cmbEquipoA').selectpicker('val', equipoA)
        if (equipoB) $('#cmbEquipoB').selectpicker('val', equipoB)
    }

    $('#cmbTorneo').on('change', async function () {
        llenarSelectClasificacion('#cmbCategoria', categoriasPorTorneo($(this).val()), 'Sin categoría', '', etiquetaCategoria)
        llenarSelectClasificacion('#cmbFase', [], 'Sin fase', '', etiquetaFase)
        try {
            await CargarEquiposPartido()
        } catch (error) {
            console.error('Error filtrando equipos por torneo:', error)
            await Swal.fire({ icon: 'error', title: 'Error', text: 'No se pudieron cargar los equipos.' })
        }
    })

    $('#cmbCategoria').on('change', async function () {
        llenarSelectClasificacion('#cmbFase', fasesPorClasificacion($('#cmbTorneo').val(), $(this).val()), 'Sin fase', '', etiquetaFase)
        try {
            await CargarEquiposPartido($(this).val())
        } catch (error) {
            console.error('Error filtrando equipos por categoría:', error)
            await Swal.fire({ icon: 'error', title: 'Error', text: 'No se pudieron cargar los equipos de la categoría.' })
        }
    })

    const CerrarModal = () => {
        $('#modal').modal('hide')
        $('#actionSeccion').addClass('d-none')
        $('#actionSeccionDivider').addClass('d-none')
        LimpiarCampos()
    }

    const LimpiarCampos = () => {
        $('input[type="text"]').val('')
        $('textarea').val('')
        $('#cmbEquipo').val('')
        $('input[type="checkbox"]').prop('checked', false)
        $('input[type="radio"]').prop('checked', false)
    }

    const AbrirPlanillaDigital = (partidoId) => {
        window.open(`/partidos/planillaDigital?id=${partidoId}`, '_blank')
    }

</script>
{% endblock %}
