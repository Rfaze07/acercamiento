{% extends '../../template.html' %}

{% block content %}
<div class="page-toolbar">
    <h2 class="page-title">{{ pagename }}</h2>
    <div class="page-filters">
        <input type="text" class="form-control form-control-sm" id="txtFiltro" placeholder="Buscar">
        <div>
            <label for="cmbClubFiltro">Club</label>
            <select class="form-control form-control-sm selectpicker" id="cmbClubFiltro" onchange="getLista()">
                <option value="t">Todos</option>
                <option value="sin_club">Sin club</option>
            </select>
        </div>
        <div>
            <label for="cmbActivoFiltro">Activos</label>
            <select class="form-control form-control-sm selectpicker" id="cmbActivoFiltro" onchange="getLista()">
                <option value="t">Todos</option>
                <option value="1" selected>Sí</option>
                <option value="0">No</option>
            </select>
        </div>
        {% if permisos.a == 1 %}
        <button type="button" id="btnNuevo" class="btn btn-sm btn-round btn-success" title="Nuevo equipo">
            <i class="fa fa-plus"></i>
        </button>
        {% endif %}
    </div>
</div>
<div class="table-responsive page-table" id="tablaDatos">
    <table class="table table-sm table-fix table-hover tableFixHead">
        <thead>
            <tr>
                <th scope="col">Acciones</th>
                <th scope="col">Equipo</th>
                <th scope="col">Club</th>
                <th scope="col">Escudo</th>
                <th scope="col">Activo</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="modal fade modal-m" data-backdrop="static" tabindex="-1" aria-hidden="true" id="modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalLabel"></h5>
                <button type="button" class="close" aria-label="Close" onclick="CerrarModal()"><span>&times;</span></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="nombre">Nombre del equipo</label>
                    <input type="text" class="form-control form-control-sm" id="nombre" maxlength="40">
                </div>
                <div class="form-group">
                    <label for="cmbClub">Club (opcional)</label>
                    <select class="form-control form-control-sm selectpicker" id="cmbClub">
                        <option value="">Sin club</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="escudo">Enlace del escudo (opcional)</label>
                    <input type="text" class="form-control form-control-sm" id="escudo" maxlength="200">
                </div>
                <div class="form-group d-none text-center" id="actionSeccion">
                    <div class="custom-control custom-switch">
                        <input type="checkbox" class="custom-control-input" id="chbActivo">
                        <label class="custom-control-label" for="chbActivo">Activo</label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="CerrarModal()">Cancelar</button>
                <button type="button" class="btn btn-success" id="btnAccion">Guardar</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const escapar = valor => $('<div>').text(valor == null ? '' : valor).html()

    const getLista = async () => {
        $('#preloaderAPP').show()
        try {
            const res = await $.post('/equipos/getListaAjax', {
                activo: $('#cmbActivoFiltro').val(),
                club: $('#cmbClubFiltro').val()
            })
            let html = ''
            if (res.status && res.data.length) {
                for (const equipo of res.data) {
                    html += `<tr>
                        <td><div style="display:flex;gap:2px;">
                            {% if permisos.m == 1 %}
                            <button class="btn btn-round btn-sm btn-warning" title="Modificar" onclick="ModalAccion('m',${Number(equipo.id)})"><i class="fa fa-pen"></i></button>
                            {% endif %}
                            {% if permisos.b == 1 %}
                            <button class="btn btn-round btn-sm btn-danger" title="Dar de baja" onclick="Eliminar(${Number(equipo.id)})"><i class="fa fa-trash-alt"></i></button>
                            {% endif %}
                        </div></td>
                        <td class="search">${escapar(equipo.nombre)}</td>
                        <td>${escapar(equipo.club || '—')}</td>
                        <td>${escapar(equipo.escudo || '—')}</td>
                        <td>${equipo.activo === 1 ? 'Sí' : 'No'}</td>
                    </tr>`
                }
            } else {
                html = `<tr><td colspan="5">${escapar(res.text || 'No existen registros cargados')}</td></tr>`
            }
            $('#tablaDatos tbody').html(html)
        } catch (error) {
            console.error(error)
            $('#tablaDatos tbody').html('<tr><td colspan="5">No se pudo cargar la lista de equipos.</td></tr>')
        } finally {
            $('#preloaderAPP').hide()
        }
    }

    const ModalAccion = async (accion, id) => {
        $('#nombre, #escudo').val('')
        $('#cmbClub').val('')
        $('#chbActivo').prop('checked', true)
        $('#actionSeccion').toggleClass('d-none', accion === 'a')
        if (accion === 'a') {
            $('#modalLabel').text('Nuevo equipo')
            $('#btnAccion').off('click').on('click', () => PostRegistro('a'))
        } else {
            $('#preloaderAPP').show()
            try {
                const res = await $.post('/equipos/getByIdAjax', { id })
                if (!res.status) throw new Error(res.text)
                $('#nombre').val(res.data.nombre)
                $('#cmbClub').val(res.data.id_club_fk || '')
                $('#escudo').val(res.data.escudo || '')
                $('#chbActivo').prop('checked', res.data.activo === 1)
                $('#modalLabel').text('Modificar equipo')
                $('#btnAccion').off('click').on('click', () => PostRegistro('m', id))
            } catch (error) {
                await MostrarSwalSinPreloader('Error', error.message || 'No se pudo cargar el equipo', 'error')
                return
            } finally {
                $('#preloaderAPP').hide()
            }
        }
        $('#modal').modal('show')
    }

    const PostRegistro = async (accion, id) => {
        $('#preloaderAPP').show()
        try {
            const body = {
                nombre: $('#nombre').val(),
                id_club_fk: $('#cmbClub').val(),
                escudo: $('#escudo').val()
            }
            const url = accion === 'a' ? '/equipos/alta' : '/equipos/modificar'
            if (accion === 'm') {
                body.id = id
                body.activo = $('#chbActivo').prop('checked') ? 1 : 0
            }
            const res = await $.post(url, body)
            await MostrarSwalSinPreloader(res.title, res.text, res.icon)
            if (res.status) {
                CerrarModal()
                await getLista()
            }
        } catch (error) {
            console.error(error)
            await MostrarSwalSinPreloader('Error', 'No se pudo guardar el equipo.', 'error')
        } finally {
            $('#preloaderAPP').hide()
        }
    }

    const Eliminar = async id => {
        const confirmacion = await Swal.fire({
            title: 'Dar de baja',
            text: 'El equipo se conservará en los registros históricos. ¿Desea continuar?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Sí, dar de baja',
            cancelButtonText: 'Cancelar'
        })
        if (!confirmacion.isConfirmed) return
        $('#preloaderAPP').show()
        try {
            const res = await $.post('/equipos/eliminar', { id })
            await MostrarSwalSinPreloader(res.title, res.text, res.icon)
            if (res.status) await getLista()
        } catch (error) {
            console.error(error)
            await MostrarSwalSinPreloader('Error', 'No se pudo dar de baja el equipo.', 'error')
        } finally {
            $('#preloaderAPP').hide()
        }
    }

    const Filtrar = () => {
        const filtro = $('#txtFiltro').val().toUpperCase()
        $('#tablaDatos tbody tr').each(function () {
            $(this).toggle($(this).find('td.search').text().toUpperCase().includes(filtro))
        })
    }

    const CerrarModal = () => {
        $('#modal').modal('hide')
        $('#actionSeccion').addClass('d-none')
        $('#nombre, #escudo').val('')
        $('#cmbClub').val('')
        $('#chbActivo').prop('checked', false)
    }

    $('#txtFiltro').on('input', Filtrar)
    $('#btnNuevo').on('click', () => ModalAccion('a'))
    $(document).ready(async () => {
        await ObtenerCmbClubes(['cmbClubFiltro', 'cmbClub'], {
            incluirInactivos: true,
            anexar: true
        })
        await getLista()
    })
</script>
{% endblock %}
